<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#294b40" />
    <meta name="description" content="在像素雪山里，提前认识 Saint-Lary-Soulan、Isola 2000、Serre Chevalier、Alpe d'Huez 和 Chamrousse 的真实雪道。" />
    <title>滑雪日记</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23294b40'/%3E%3Cpath d='M5 30 17 9l7 13 4-7 9 15Z' fill='%23f6f2e7'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  </head>
  <body>
    <div id="app">
      <div class="loading" role="status"><span class="loading-mountain">▲</span><h1>正在铺好雪道</h1><p></p></div>
    </div>
    <script>
      // Loading text in the remembered (or browser) language, before the app's own i18n loads.
      (function () {
        var l; try { l = localStorage.getItem('ski2d.lang'); } catch (e) {}
        l = l || (navigator.language || '').slice(0, 2).toLowerCase();
        var t = { zh: ['滑雪日记', '正在铺好雪道', 'zh-CN'], en: ['Ski Diary', 'Grooming the pistes', 'en'], fr: ['Journal de ski', 'Damage des pistes', 'fr'] }[l] || ['Ski Diary', 'Grooming the pistes', 'en'];
        document.title = t[0]; document.querySelector('.loading h1').textContent = t[1]; document.documentElement.lang = t[2];
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
